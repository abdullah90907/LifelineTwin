<!doctype html><html lang="en"><head><meta charset="utf-8"><title>LifelineTwin · design verification</title><style>body{margin:0;background:#090f18;font:11px system-ui;color:#a7b6cb}header{padding:9px 12px;display:flex;gap:12px;position:sticky;top:0;z-index:2;background:#121e2d;border-bottom:1px solid #304057;align-items:center}select{font:inherit;padding:4px;background:#24354b;color:#c5d4e3;border:1px solid #3b4f69;border-radius:3px}#stage{margin:12px auto;position:relative}iframe{border:1px solid #29394e;transform-origin:top left;display:block;background:#0c121d}output{font:9px Consolas,monospace}</style></head><body><header><strong>Design verification</strong><label>Viewport <select id="width"><option>1440</option><option>1024</option><option>768</option><option>390</option></select></label><output id="result"></output></header><div id="stage"><iframe title="LifelineTwin analytical workspace" src="/"></iframe></div><script type="module">
const frame=document.querySelector('iframe'),stage=document.querySelector('#stage'),select=document.querySelector('select'),result=document.querySelector('output');
const requested=new URL(new URLSearchParams(location.search).get("path")??"/",location.origin);if(requested.origin===location.origin)frame.src=requested.pathname;
function size(){const width=Number(select.value),height=width>=1000?900:844,scale=new URLSearchParams(location.search).has('native')?1:Math.min(1,(window.innerWidth-24)/width);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform=`scale(${scale})`;stage.style.width=width*scale+'px';stage.style.height=height*scale+'px';setTimeout(check,700)}
function check(){const doc=frame.contentDocument;if(!doc)return;const main=doc.querySelector('main');result.textContent=`${frame.contentWindow.innerWidth}px · overflow ${doc.documentElement.scrollWidth>frame.contentWindow.innerWidth||(main&&main.scrollWidth>main.clientWidth)?'YES':'none'} · ${doc.querySelector('[data-renderer]')?.getAttribute('data-renderer')??'module'}`}
select.addEventListener('change',size);window.addEventListener('resize',size);frame.addEventListener('load',size);setInterval(check,2000);size();
</script></body></html>
